[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-agent-rag-mcp"
version = "0.4.0"
description = "A standalone Agentic RAG service with Streamable HTTP MCP and a debugging console."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "mcp==2.1.1",
    "pypdf>=5,<7",
    "python-multipart>=0.0.20,<1",
    "python-docx>=1.1.2,<2",
    "docxlatex==1.2.3",
    "markdown-it-py>=3,<5",
    "qdrant-client>=1.12,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
api = [
    "transformers>=4.57,<5",
]
dense = [
    "FlagEmbedding>=1.3,<2",
    "transformers>=4.44,<5",
]
pdf = [
    "docling==2.126.0",
    "torch>=2.7,<3",
    "transformers>=4.57,<5",
]

[project.urls]
Repository = "https://github.com/Guan0923/xinghe_rag"
Issues = "https://github.com/Guan0923/xinghe_rag/issues"

[project.scripts]
rag-mcp-debug = "rag_mcp.debug:main"
rag-mcp-ingest = "rag_mcp.ingest:main"
rag-service = "rag_mcp.http_service:main"
rag-service-migrate = "rag_mcp.migrate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_mcp = ["web/*", "web/assets/*", "web/pdfjs/cmaps/*", "web/pdfjs/standard_fonts/*", "web/pdfjs/wasm/*"]
