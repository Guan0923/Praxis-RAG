[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-agent-rag-mcp"
version = "0.3.0"
description = "A standalone Agentic RAG service, stdio MCP adapter, and debugging console."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "mcp>=1.28,<2",
    "python-multipart>=0.0.20,<1",
    "qdrant-client>=1.12,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dense = [
    "FlagEmbedding>=1.3,<2",
]

[project.urls]
Repository = "https://github.com/Guan0923/xinghe_rag"
Issues = "https://github.com/Guan0923/xinghe_rag/issues"

[project.scripts]
rag-mcp = "rag_mcp.server:main"
rag-mcp-debug = "rag_mcp.debug:main"
rag-mcp-ingest = "rag_mcp.ingest:main"
rag-service = "rag_mcp.http_service:main"
rag-service-migrate = "rag_mcp.migrate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_mcp = ["web/*"]
