name: praxis-rag

services:
  mysql:
    image: mysql:8.0
    container_name: praxis-rag-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${RAG_MYSQL_DATABASE:-praxis_rag}
      MYSQL_USER: ${RAG_MYSQL_USER:-rag}
      MYSQL_PASSWORD: ${RAG_MYSQL_PASSWORD:?set RAG_MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      TZ: UTC
    ports:
      - "${RAG_MYSQL_PORT:-3307}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --max-allowed-packet=64M
      # Required by the Debezium bridge: row-based binlog with full before/after
      # images. Harmless when running with RAG_OUTBOX_BRIDGE=relay.
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --server-id=1
      - --binlog-expire-logs-seconds=604800
    volumes:
      - mysql_data:/var/lib/mysql
      # Creates the least-privilege CDC user used by Debezium on first init.
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  qdrant:
    image: qdrant/qdrant:latest
    container_name: praxis-rag-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7.4-alpine
    container_name: praxis-rag-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RAG_REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Single-node KRaft Kafka used by the async document/search queues and the
  # optional Debezium bridge. Two listeners:
  #   INTERNAL kafka:9092   -> rag-service/worker/Debezium containers on this network
  #   EXTERNAL 127.0.0.1:9092 -> processes on the host (start-stack, local binaries)
  # The external listener binds container port 29092 and is published on the host
  # as 9092. Kafka advertises the address clients must use, so host and container
  # clients intentionally see different bootstrap addresses.
  # Auto topic creation is enabled with 4 partitions; the start-stack script may
  # create the known topics explicitly.
  kafka:
    image: ${RAG_KAFKA_IMAGE:-apache/kafka:3.9.0}
    container_name: praxis-rag-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RAG_KAFKA_HOST_PORT:-9092}:29092"
    environment:
      CLUSTER_ID: ${RAG_KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "4"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      # apache/kafka defaults log.dirs to /tmp/kafka-logs; point it at the volume
      # so topics/offsets survive container recreation.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  # Optional CDC bridge: tails the MySQL binlog of the transactional outbox
  # table and publishes each committed notification to Kafka with the native
  # Debezium Kafka sink. Enable with
  #   docker compose --profile debezium up -d
  # and run rag-service/rag-document-worker with RAG_OUTBOX_BRIDGE=debezium.
  # See deploy/debezium/README.md. Not started by default.
  debezium:
    image: ${DEBEZIUM_IMAGE:-quay.io/debezium/server:3.7.1.Final}
    container_name: praxis-rag-debezium
    restart: unless-stopped
    profiles: ["debezium"]
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      RAG_MYSQL_HOST: mysql
      RAG_MYSQL_PORT: "3306"
      RAG_MYSQL_USER: ${RAG_MYSQL_DEBEZIUM_USER:-debezium}
      RAG_MYSQL_PASSWORD: ${RAG_MYSQL_DEBEZIUM_PASSWORD:?set RAG_MYSQL_DEBEZIUM_PASSWORD in .env}
      RAG_MYSQL_DATABASE: ${RAG_MYSQL_DATABASE:-praxis_rag}
      # Container-internal bootstrap address. The host-facing value in .env is
      # 127.0.0.1:9092; do not pass it into Debezium containers.
      RAG_KAFKA_BOOTSTRAP_SERVERS: ${RAG_APP_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      # SMT target topic; must match the app-side RAG_DOCUMENT_TOPIC.
      RAG_DOCUMENT_TOPIC: ${RAG_DOCUMENT_TOPIC:-praxis_document_ingest}
      DEBEZIUM_SERVER_ID: ${DEBEZIUM_SERVER_ID:-184054}
      QUARKUS_LOG_LEVEL: ${DEBEZIUM_LOG_LEVEL:-INFO}
    volumes:
      # Debezium Server reads its config from /debezium/config (not /debezium/conf).
      - ./deploy/debezium/application.properties:/debezium/config/application.properties:ro
      - debezium_data:/debezium/data

  # Go backend service. Kept out of the default (infra-only) profile:
  #   docker compose --profile app up -d --build
  # The image builds the Console and every cmd/* entrypoint from this repo.
  # RAG_SERVICE_TOKEN is required at run time (the container binds 0.0.0.0);
  # the state backend defaults to the shared MySQL below (override with
  # RAG_STATE_URL / RAG_APP_MYSQL_*), and Qdrant runs as a compose service.
  # Kafka is required for async queues; this service uses the container-internal
  # bootstrap address even though the host .env uses 127.0.0.1:9092.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${RAG_APP_IMAGE:-praxis-rag:local}
    container_name: praxis-rag-app
    restart: unless-stopped
    profiles: ["app"]
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      RAG_SERVICE_TOKEN: ${RAG_SERVICE_TOKEN:-}
      RAG_SERVICE_HOST: "0.0.0.0"
      RAG_SERVICE_PORT: "8011"
      RAG_WEB_ROOT: /app/web
      QDRANT_URL: ${RAG_APP_QDRANT_URL:-http://qdrant:6333}
      RAG_MYSQL_HOST: ${RAG_APP_MYSQL_HOST:-mysql}
      RAG_MYSQL_PORT: "3306"
      RAG_MYSQL_USER: ${RAG_MYSQL_USER:-rag}
      RAG_MYSQL_PASSWORD: ${RAG_MYSQL_PASSWORD:-}
      RAG_MYSQL_DATABASE: ${RAG_MYSQL_DATABASE:-praxis_rag}
      RAG_STATE_ENCRYPTION_KEY: ${RAG_STATE_ENCRYPTION_KEY:-}
      RAG_KAFKA_BOOTSTRAP_SERVERS: ${RAG_APP_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      RAG_OUTBOX_BRIDGE: ${RAG_OUTBOX_BRIDGE:-relay}
      RAG_CACHE_TOPIC: ${RAG_CACHE_TOPIC:-praxis_state_cache_refresh}
      RAG_CACHE_GROUP: ${RAG_CACHE_GROUP:-praxis_state_cache_refresh_workers}
      RAG_DOCUMENT_TOPIC: ${RAG_DOCUMENT_TOPIC:-praxis_document_ingest}
      RAG_DOCUMENT_GROUP: ${RAG_DOCUMENT_GROUP:-praxis_document_ingest_workers}
      RAG_SEARCH_TOPIC: ${RAG_SEARCH_TOPIC:-praxis_search}
      RAG_SEARCH_GROUP: ${RAG_SEARCH_GROUP:-praxis_search_workers}
      RAG_DOCUMENT_DLQ_TOPIC: ${RAG_DOCUMENT_DLQ_TOPIC:-praxis_document_ingest_dead_letters}
      RAG_SEARCH_DLQ_TOPIC: ${RAG_SEARCH_DLQ_TOPIC:-praxis_search_dead_letters}
      RAG_DOCUMENT_DLQ_GROUP: ${RAG_DOCUMENT_DLQ_GROUP:-praxis_document_dead_letters}
      RAG_SEARCH_DLQ_GROUP: ${RAG_SEARCH_DLQ_GROUP:-praxis_search_dead_letters}
      RAG_MCP_ALLOWED_HOSTS: ${RAG_MCP_ALLOWED_HOSTS:-127.0.0.1,127.0.0.1:*,localhost,localhost:*}
      RAG_MCP_ALLOWED_ORIGINS: ${RAG_MCP_ALLOWED_ORIGINS:-http://127.0.0.1,http://127.0.0.1:*,http://localhost,http://localhost:*}
    ports:
      - "127.0.0.1:${RAG_APP_PORT:-8011}:8011"
    volumes:
      - praxis_app_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8011/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
volumes:
  kafka_data:
  mysql_data:
  praxis_app_data:
  qdrant_data:
  redis_data:
  debezium_data:
