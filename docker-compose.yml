services:
  mysql:
    image: mysql:8.0
    container_name: praxis-rag-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${RAG_MYSQL_DATABASE:-praxis_rag}
      MYSQL_USER: ${RAG_MYSQL_USER:-rag}
      MYSQL_PASSWORD: ${RAG_MYSQL_PASSWORD:?set RAG_MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      TZ: UTC
    ports:
      - "${RAG_MYSQL_PORT:-3307}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --max-allowed-packet=64M
      # Required by the Debezium bridge: row-based binlog with full before/after
      # images. Harmless when running with RAG_OUTBOX_BRIDGE=relay.
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --server-id=1
      - --binlog-expire-logs-seconds=604800
    volumes:
      - mysql_data:/var/lib/mysql
      # Creates the least-privilege CDC user used by Debezium on first init.
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  qdrant:
    image: qdrant/qdrant:latest
    container_name: praxis-rag-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7.4-alpine
    container_name: praxis-rag-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RAG_REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.3
    container_name: praxis-rag-rocketmq-namesrv
    restart: unless-stopped
    command: ["sh", "mqnamesrv"]
    environment:
      JAVA_OPT_EXT: "-Xms128m -Xmx128m -Xmn64m"

  rocketmq-storage-init:
    image: apache/rocketmq:5.3.3
    user: "0:0"
    entrypoint: ["sh", "-c", "chown -R 3000:3000 /home/rocketmq/store"]
    volumes:
      - rocketmq_data:/home/rocketmq/store

  rocketmq:
    image: apache/rocketmq:5.3.3
    container_name: praxis-rag-rocketmq
    restart: unless-stopped
    depends_on:
      rocketmq-namesrv:
        condition: service_started
      rocketmq-storage-init:
        condition: service_completed_successfully
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m"
    command:
      - sh
      - -c
      - >-
        sed "s/^brokerIP1=.*/brokerIP1=${RAG_ROCKETMQ_BROKER_IP:-127.0.0.1}/"
        /home/rocketmq/rocketmq-5.3.3/conf/praxis-broker.conf > /tmp/praxis-broker.conf
        && sed "s/__GRPC_PORT__/${RAG_ROCKETMQ_PROXY_PORT:-8081}/"
        /tmp/rmq-proxy.template.json > /home/rocketmq/rocketmq-5.3.3/conf/rmq-proxy.json
        && exec sh mqbroker --enable-proxy -c /tmp/praxis-broker.conf
    ports:
      # The gRPC proxy advertises its *internal* port to clients, so the host port
      # must equal the port the proxy binds inside the container (grpcServerPort).
      # 8081 collides with McAfee (macmnsvc) on some Windows machines.
      - "127.0.0.1:${RAG_ROCKETMQ_PROXY_PORT:-8081}:${RAG_ROCKETMQ_PROXY_PORT:-8081}"
    volumes:
      - ./deploy/rocketmq-broker.conf:/home/rocketmq/rocketmq-5.3.3/conf/praxis-broker.conf:ro
      # The gRPC proxy reads conf/rmq-proxy.json (JSON), not the broker properties file.
      - ./deploy/rocketmq-proxy.json:/tmp/rmq-proxy.template.json:ro
      - rocketmq_data:/home/rocketmq/store

  # Optional CDC bridge: tails the MySQL binlog of the transactional outbox
  # table and publishes one notification per committed upload. Enable with
  #   docker compose --profile debezium up -d
  # and run rag-service/rag-document-worker with RAG_OUTBOX_BRIDGE=debezium.
  # See deploy/debezium/README.md. Not started by default.
  debezium:
    image: ${DEBEZIUM_IMAGE:-quay.io/debezium/server:3.7.1.Final}
    container_name: praxis-rag-debezium
    restart: unless-stopped
    profiles: ["debezium"]
    # The MySQL connector speaks the RocketMQ remoting protocol and must reach the
    # broker address the broker advertises. Sharing the broker's network namespace
    # makes that address (127.0.0.1:10911) directly reachable and keeps the
    # host-side clients working with the same brokerIP1.
    network_mode: "service:rocketmq"
    depends_on:
      mysql:
        condition: service_healthy
      rocketmq:
        condition: service_started
    environment:
      RAG_MYSQL_HOST: mysql
      RAG_MYSQL_PORT: "3306"
      RAG_MYSQL_USER: ${RAG_MYSQL_DEBEZIUM_USER:-debezium}
      RAG_MYSQL_PASSWORD: ${RAG_MYSQL_DEBEZIUM_PASSWORD:?set RAG_MYSQL_DEBEZIUM_PASSWORD in .env}
      RAG_MYSQL_DATABASE: ${RAG_MYSQL_DATABASE:-praxis_rag}
      # Must match the app-side RAG_DOCUMENT_TOPIC (RocketMQ topic names have no dots).
      RAG_DOCUMENT_TOPIC: ${RAG_DOCUMENT_TOPIC:-praxis_document_ingest}
      DEBEZIUM_TOPIC_PREFIX: ${DEBEZIUM_TOPIC_PREFIX:-praxis_document_ingest}
      RAG_ROCKETMQ_NAMESRV: ${RAG_ROCKETMQ_NAMESRV:-rocketmq-namesrv:9876}
      DEBEZIUM_SERVER_ID: ${DEBEZIUM_SERVER_ID:-184054}
      QUARKUS_LOG_LEVEL: ${DEBEZIUM_LOG_LEVEL:-INFO}
    volumes:
      # Debezium Server reads its config from /debezium/config (not /debezium/conf).
      - ./deploy/debezium/application.properties:/debezium/config/application.properties:ro
      - debezium_data:/debezium/data

  # Go backend service. Kept out of the default (infra-only) profile:
  #   docker compose --profile app up -d --build
  # The image builds the Console and every cmd/* entrypoint from this repo.
  # RAG_SERVICE_TOKEN is required at run time (the container binds 0.0.0.0);
  # the state backend defaults to the shared MySQL below (override with
  # RAG_STATE_URL / RAG_APP_MYSQL_*), and Qdrant runs as a compose service.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${RAG_APP_IMAGE:-praxis-rag:local}
    container_name: praxis-rag-app
    restart: unless-stopped
    profiles: ["app"]
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      RAG_SERVICE_TOKEN: ${RAG_SERVICE_TOKEN:-}
      RAG_SERVICE_HOST: "0.0.0.0"
      RAG_SERVICE_PORT: "8011"
      RAG_WEB_ROOT: /app/web
      QDRANT_URL: ${RAG_APP_QDRANT_URL:-http://qdrant:6333}
      RAG_MYSQL_HOST: ${RAG_APP_MYSQL_HOST:-mysql}
      RAG_MYSQL_PORT: "3306"
      RAG_MYSQL_USER: ${RAG_MYSQL_USER:-rag}
      RAG_MYSQL_PASSWORD: ${RAG_MYSQL_PASSWORD:-}
      RAG_MYSQL_DATABASE: ${RAG_MYSQL_DATABASE:-praxis_rag}
      RAG_STATE_ENCRYPTION_KEY: ${RAG_STATE_ENCRYPTION_KEY:-}
      RAG_MCP_ALLOWED_HOSTS: ${RAG_MCP_ALLOWED_HOSTS:-127.0.0.1,127.0.0.1:*,localhost,localhost:*}
      RAG_MCP_ALLOWED_ORIGINS: ${RAG_MCP_ALLOWED_ORIGINS:-http://127.0.0.1,http://127.0.0.1:*,http://localhost,http://localhost:*}
    ports:
      - "127.0.0.1:${RAG_APP_PORT:-8011}:8011"
    volumes:
      - praxis_app_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8011/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
volumes:
  mysql_data:
  praxis_app_data:
  qdrant_data:
  redis_data:
  rocketmq_data:
  debezium_data:
