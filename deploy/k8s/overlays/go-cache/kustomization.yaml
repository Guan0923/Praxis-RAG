# go 入口 + 展示缓存：API/MCP/Console、文档 worker、文档死信 worker，
# 以及 rag-cache-worker / rag-dead-letter-cache。
#
#   kubectl kustomize deploy/k8s/overlays/go-cache
#   kubectl apply -k deploy/k8s/overlays/go-cache
#
# 前提：Secret 里已有 RAG_REDIS_URL，且集群内可达该 Redis。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: praxis-rag

resources:
  - ../go

components:
  - ../../components/cache
