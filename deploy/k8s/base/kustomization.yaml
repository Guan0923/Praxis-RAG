# 公共工作负载：API/MCP/Console、文档 worker、文档死信 worker。
#
# 这里只有「两种入口都需要」的对象。PDF 高保真（pdf-parser）在
# overlays/vision 里，缓存消费者与 Redis 相关配置在 components/cache 里，
# 一次性初始化资源在 bootstrap/ 里。
#
# 渲染入口是 overlays/go 或 overlays/vision（两者都是完整安装入口），
# 直接渲染 base/ 只用于调试清单。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: praxis-rag

resources:
  - ../common
  - service-rag-service.yaml
  - deployment-rag-service.yaml
  - deployment-rag-document-worker.yaml
  - deployment-rag-dead-letter-document.yaml
  - rbac-monitor-ops.yaml
