# Secret 契约示例（占位值，禁止把真实凭据提交进仓库）。
#
# 推荐用命令创建，避免把明文写进 shell 历史之外的任何文件：
#
#   kubectl -n praxis-rag create secret generic praxis-rag-secrets \
#     --from-literal=RAG_SERVICE_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=RAG_MYSQL_PASSWORD='<应用账号口令>' \
#     --from-literal=RAG_STATE_ENCRYPTION_KEY='<32+ 字节随机串>' \
#     --from-literal=RAG_MYSQL_DEBEZIUM_PASSWORD='<document CDC 账号口令>' \
#     --from-literal=RAG_MYSQL_DEBEZIUM_CACHE_PASSWORD='<cache CDC 账号口令>'
#
# 可选键按需追加（--from-literal=KEY=...），未提供时对应引用为 optional:
#   RAG_REDIS_URL                    启用 components/cache 时必填
#   RAG_VLM_API_KEY                  服务级 Vision 兜底
#   RAG_FEISHU_APP_SECRET            启用飞书导入时必填
#   RAG_KAFKA_SASL_PASSWORD          Kafka 需要 SASL 时必填
#   RAG_MIGRATE_MYSQL_USER           独立迁移账号（只注入 state-migrate Job）
#   RAG_MIGRATE_MYSQL_PASSWORD       同上
#
# 已有 Secret 时把它们改成同样的键名即可（清单只认键名，不认 Secret 名以外的结构）：
#   kubectl -n praxis-rag edit secret praxis-rag-secrets
apiVersion: v1
kind: Secret
metadata:
  name: praxis-rag-secrets
  labels:
    app.kubernetes.io/name: praxis-rag
    app.kubernetes.io/part-of: praxis-rag
type: Opaque
stringData:
  # --- 必填 -----------------------------------------------------------
  # API/MCP/Console 的 Bearer Token；非 loopback 绑定时代码强制要求非空。
  RAG_SERVICE_TOKEN: REPLACE_WITH_RANDOM_TOKEN
  # 应用 MySQL 账号（配置里 RAG_MYSQL_USER，默认 rag）的口令。
  RAG_MYSQL_PASSWORD: REPLACE_WITH_MYSQL_PASSWORD
  # 状态加密密钥（enc:v1: 凭据）。API 与全部 worker 必须完全一致。
  RAG_STATE_ENCRYPTION_KEY: REPLACE_WITH_STATE_ENCRYPTION_KEY
  # 只给 bootstrap/connect-register：两个 CDC 采集账号的口令。
  RAG_MYSQL_DEBEZIUM_PASSWORD: REPLACE_WITH_DOCUMENT_CDC_PASSWORD
  RAG_MYSQL_DEBEZIUM_CACHE_PASSWORD: REPLACE_WITH_CACHE_CDC_PASSWORD

  # --- 可选 -----------------------------------------------------------
  # RAG_REDIS_URL: redis://:PASSWORD@redis.infra.svc.cluster.local:6379/0
  # RAG_VLM_API_KEY: REPLACE_WITH_VLM_API_KEY
  # RAG_FEISHU_APP_SECRET: REPLACE_WITH_FEISHU_APP_SECRET
  # RAG_KAFKA_SASL_PASSWORD: REPLACE_WITH_KAFKA_PASSWORD
  # RAG_MIGRATE_MYSQL_USER: rag_migrate
  # RAG_MIGRATE_MYSQL_PASSWORD: REPLACE_WITH_MIGRATE_PASSWORD
