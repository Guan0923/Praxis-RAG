# Debezium Server — MySQL binlog -> Kafka bridge for the transactional outbox.
#
# Purpose: every row inserted into `<database>.document_job_outbox` inside the
# upload transaction is published to a Kafka topic as one JSON change event.
# The document worker accepts that event directly (it reads `after.artifact_id`),
# so no additional SMT/script transform is required beyond routing all records to
# the single topic configured by RAG_DOCUMENT_TOPIC.
#
# Native Kafka sink properties verified against the Debezium Server operations
# documentation for Debezium 3.x:
#   https://debezium.io/documentation/reference/stable/operations/debezium-server.html
# The sink is part of debezium-server (no extra sink module needed) and accepts
# Kafka producer settings under `debezium.sink.kafka.producer.*`.

# --- Sink: native Kafka ---------------------------------------------------
debezium.sink.type=kafka
# Container-internal bootstrap address. Compose sets this env var to kafka:9092;
# host processes must NOT use this file (they use RAG_KAFKA_BOOTSTRAP_SERVERS).
debezium.sink.kafka.producer.bootstrap.servers=${RAG_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
# Debezium Server writes the JSON envelope as a String; use String serializers.
debezium.sink.kafka.producer.key.serializer=org.apache.kafka.common.serialization.StringSerializer
debezium.sink.kafka.producer.value.serializer=org.apache.kafka.common.serialization.StringSerializer
debezium.sink.kafka.producer.acks=all
debezium.sink.kafka.producer.enable.idempotence=true
debezium.sink.kafka.producer.retries=2147483647

# --- Source: MySQL connector ----------------------------------------------
debezium.source.connector.class=io.debezium.connector.mysql.MySqlConnector
debezium.source.database.hostname=${RAG_MYSQL_HOST:mysql}
debezium.source.database.port=${RAG_MYSQL_PORT:3306}
debezium.source.database.user=${RAG_MYSQL_USER:debezium}
debezium.source.database.password=${RAG_MYSQL_PASSWORD}
debezium.source.database.server.id=${DEBEZIUM_SERVER_ID:184054}
# MySQL 8 defaults to caching_sha2_password; over an unencrypted connection the
# JDBC driver cannot fetch the server public key and connection validation fails
# with an empty SQLException message. `preferred` lets the driver use the TLS
# certs the stock image generates, while still allowing plain connections.
# Use required/verify_ca/verify_identity when a real CA is configured.
debezium.source.database.ssl.mode=preferred

# Logical server name (required by the MySQL connector). The SMT below rewrites
# every record's destination, so this prefix does not appear in Kafka topics.
debezium.source.topic.prefix=praxis_rag
debezium.source.database.include.list=${RAG_MYSQL_DATABASE:praxis_rag}
debezium.source.table.include.list=${RAG_MYSQL_DATABASE:praxis_rag}.document_job_outbox

# Never take table locks during the initial snapshot: the outbox is a small,
# high-churn table and the application is writing to it continuously.
debezium.source.snapshot.locking.mode=none
# DDL/schema-change records are not outbox notifications. The SMT below reroutes
# EVERY connector record, including schema changes, so they must be disabled or
# the worker would receive DDL on RAG_DOCUMENT_TOPIC and reject it as poison.
debezium.source.include.schema.changes=false

# --- Durable connector state ----------------------------------------------
# Offsets and schema history live on the debezium_data volume so a container
# restart resumes from the binlog position instead of re-snapshotting.
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=0
debezium.source.schema.history.internal=io.debezium.storage.file.history.FileSchemaHistory
debezium.source.schema.history.internal.file.filename=/debezium/data/schema-history.dat

# --- Serialisation --------------------------------------------------------
debezium.format.key=json
debezium.format.value=json
# MUST stay false. With schemas enabled the value is wrapped as
# {"schema": ..., "payload": {...}} and the document worker would no longer
# find the change fields at the top level.
debezium.format.value.schemas.enable=false
debezium.format.key.schemas.enable=false

# --- Topic routing --------------------------------------------------------
# Route every captured outbox row to ONE topic equal to RAG_DOCUMENT_TOPIC
# (default praxis_document_ingest). The connector's default destination is
# <topic.prefix>.<database>.<table>, which would split records across topics
# and would not match the worker's consumer setting.
debezium.source.transforms=Reroute
debezium.source.transforms.Reroute.type=io.debezium.transforms.ByLogicalTableRouter
debezium.source.transforms.Reroute.topic.regex=(.*)
debezium.source.transforms.Reroute.topic.replacement=${RAG_DOCUMENT_TOPIC:praxis_document_ingest}
debezium.source.transforms.Reroute.key.enforce.uniqueness=false
