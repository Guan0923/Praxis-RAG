# Debezium Server — 任务连接器：MySQL binlog -> Kafka（document_jobs）
#
# 只采集 document_jobs 的“调度标识”列，每条被受理的任务或调度版本变化各投递一条通知：
#   document_jobs (artifact_id, namespace, schedule_version) -> RAG_DOCUMENT_TOPIC
#
# 搜索已改为同步执行：搜索不再有任务表/通知，`search_tasks` 是历史表（保留历史数据、
# 不再写入也不再读取），因此不再出现在 table.include.list / column.include.list / 路由中。
#
# 过滤完全由三个连接器级配置完成，不需要任何 SMT 脚本（库存镜像即可运行）：
#   1) column.include.list 只保留定位列：心跳/进度/终态列（lease_until、stage、
#      status、error、owner、content 等）根本不会出现在变更值里，正文与凭据不经过 Kafka。
#   2) skip.messages.without.change=true：只有“被采集列发生变化”的 UPDATE 才投递。
#      因此心跳、进度、成功/失败终态等普通 UPDATE 被连接器丢弃；唯一会被投递的
#      UPDATE 就是 schedule_version 递增（重发）——这是同一任务需要再次执行的信号。
#   3) skipped.operations=d：清理类 DELETE（任务保留期回收、切换脚本）不进入业务 topic，
#      也不会产生 tombstone。
# 消费端仍会在 MySQL 事务内按 artifact_id + namespace + schedule_version +
# 租约/终态条件领取，因此即使重复投递或过滤配置失效也不会重复执行（纵深防御）。
#
# 首次启动：snapshot.mode=initial 会为 document_jobs 的现存行各投递一次 op=r。
# 消费者对终态/已领取/版本不符的行安全跳过；遗留未完成任务因此天然补投一次，
# 切换阶段依赖这一特性。切换时再用 rag-cdc-cutover --backfill 把 document_jobs 中
# 仍未完成任务的 schedule_version 递增到基线，避免“快照完成前的 UPDATE 丢失”。
#
# 断点恢复：offset 与 schema history 写在独立的 tasks volume（/debezium/data）上，
# 容器重启从上次提交的 binlog 位点继续，不会重新快照。只有明确要做全量重放时才删除该卷。
#
# 删除/重复投递：Kafka 是至少一次投递。DELETE 已被 skipped.operations=d 过滤；
# 重复或过期的通知由 worker 的 Claim 条件（版本/租约/终态）安全跳过并 ACK。
#
# Native Kafka sink properties verified against the Debezium Server operations
# documentation for Debezium 3.x:
#   https://debezium.io/documentation/reference/stable/operations/debezium-server.html

# --- Sink: native Kafka ---------------------------------------------------
debezium.sink.type=kafka
# Container-internal bootstrap address. Compose sets this env var to kafka:9092;
# host processes must NOT use this file (they use RAG_KAFKA_BOOTSTRAP_SERVERS).
debezium.sink.kafka.producer.bootstrap.servers=${RAG_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
# Debezium Server writes the JSON envelope as a String; use String serializers.
debezium.sink.kafka.producer.key.serializer=org.apache.kafka.common.serialization.StringSerializer
debezium.sink.kafka.producer.value.serializer=org.apache.kafka.common.serialization.StringSerializer
debezium.sink.kafka.producer.acks=all
debezium.sink.kafka.producer.enable.idempotence=true
debezium.sink.kafka.producer.retries=2147483647

# --- Source: MySQL connector ----------------------------------------------
debezium.source.connector.class=io.debezium.connector.mysql.MySqlConnector
debezium.source.database.hostname=${RAG_MYSQL_HOST:mysql}
debezium.source.database.port=${RAG_MYSQL_PORT:3306}
debezium.source.database.user=${RAG_MYSQL_USER:debezium}
debezium.source.database.password=${RAG_MYSQL_PASSWORD}
# Must differ from the cache connector's server id: two binlog readers on the
# same MySQL instance need distinct replication identities.
debezium.source.database.server.id=${DEBEZIUM_SERVER_ID:184054}
# MySQL 8 defaults to caching_sha2_password; over an unencrypted connection the
# JDBC driver cannot fetch the server public key and connection validation fails
# with an empty SQLException message. `preferred` lets the driver use the TLS
# certs the stock image generates, while still allowing plain connections.
# Use required/verify_ca/verify_identity when a real CA is configured.
debezium.source.database.ssl.mode=preferred

# Logical server name (required by the MySQL connector). The ByLogicalTableRouter
# transform below rewrites every record's destination to the configured topic, so
# this prefix never appears in the business topics.
debezium.source.topic.prefix=praxis_rag
debezium.source.database.include.list=${RAG_MYSQL_DATABASE:praxis_rag}
debezium.source.table.include.list=${RAG_MYSQL_DATABASE:praxis_rag}.document_jobs

# Locator columns only: schedule_version carries the generation; artifact_id +
# namespace identify the row. Anything else (heartbeat, progress, terminal state,
# content) is deliberately absent from the change value.
debezium.source.column.include.list=${RAG_MYSQL_DATABASE:praxis_rag}.document_jobs.artifact_id,${RAG_MYSQL_DATABASE:praxis_rag}.document_jobs.namespace,${RAG_MYSQL_DATABASE:praxis_rag}.document_jobs.schedule_version

# Only deliver UPDATEs whose captured columns actually changed: drops heartbeat,
# stage-progress and terminal-state updates, keeps only schedule_version bumps.
debezium.source.skip.messages.without.change=true

# Cleanup DELETEs are not task signals: keep them out of the business topics
# (skipped.operations does not apply to the initial snapshot).
debezium.source.skipped.operations=d

# DDL/schema-change records must never reach the business topics.
debezium.source.include.schema.changes=false

# Initial snapshot replays existing task rows once (op=r); consumers skip
# terminal rows and re-notify unfinished ones. No table locks: the binlog
# low-watermark merge still keeps the snapshot consistent without blocking writes.
debezium.source.snapshot.mode=initial
debezium.source.snapshot.locking.mode=none

# --- Durable connector state ----------------------------------------------
# Offsets and schema history live on the dedicated tasks volume so a container
# restart resumes from the binlog position instead of re-snapshotting.
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=0
debezium.source.schema.history.internal=io.debezium.storage.file.history.FileSchemaHistory
debezium.source.schema.history.internal.file.filename=/debezium/data/schema-history.dat

# --- Serialisation --------------------------------------------------------
debezium.format.key=json
debezium.format.value=json
# MUST stay false. With schemas enabled the value is wrapped as
# {"schema": ..., "payload": {...}} and consumers would no longer find the
# change fields (before/after/op/source) at the top level.
debezium.format.value.schemas.enable=false
debezium.format.key.schemas.enable=false

# --- Topic routing --------------------------------------------------------
# One ByLogicalTableRouter routes document_jobs to its own business topic (the
# connector default is <topic.prefix>.<database>.<table>, which consumers do not
# subscribe to). key.enforce.uniqueness=false keeps the original row key
# (artifact_id) instead of appending a physical-table identifier.
debezium.source.transforms=RouteDocumentJobs
debezium.source.transforms.RouteDocumentJobs.type=io.debezium.transforms.ByLogicalTableRouter
debezium.source.transforms.RouteDocumentJobs.topic.regex=(.*)document_jobs
debezium.source.transforms.RouteDocumentJobs.topic.replacement=${RAG_DOCUMENT_TOPIC:praxis_document_ingest}
debezium.source.transforms.RouteDocumentJobs.key.enforce.uniqueness=false
