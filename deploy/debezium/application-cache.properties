# ============================================================================
# 已下线，仅回滚保留。生产采集层是分布式 Kafka Connect：
#   deploy/kafka-connect/connectors/cache-cdc.json
# 操作手册：deploy/kafka-connect/README.md
# 本文件不再被 docker-compose.yml / scripts/start-stack.ps1 引用。
# ============================================================================
#
# Debezium Server — 缓存连接器：MySQL binlog -> Kafka（影响缓存读模型的业务表）
#
# 采集会影响 Redis 读模型的业务表，每次行变更（c/u/d）都投递一条“表 + 操作 +
# 定位列”事件，统一路由到 RAG_CACHE_TOPIC：
#   knowledge_bases, documents, mcp_catalogs, document_heads,
#   document_leases, upload_operations, upload_steps
#
# 与任务连接器的区别（§4.4：skipped.operations / skip.messages.without.change
# 是连接器级配置，无法按表差异化，所以拆成两个 Debezium Server 实例）：
#   - 不跳过 DELETE：清理旧文档等删除同样要让缓存失效/重建；
#   - skip.messages.without.change=false：任何行变更都投递，即使变更的列不在
#     定位列白名单内（例如只改 knowledge_bases.settings / documents 的正文摘要），
#     消费端仍需要收到一个“这一行变了”的信号去递增 revision；
#   - tombstones.on.delete=false：消费端只用 delete 事件 before 镜像里的定位列，
#     不需要 value 为 null 的 tombstone（也不产生无谓的 Kafka 记录）。
#
# column.include.list 只包含定位标识，永远不包含文件内容、查询正文、凭据、
# knowledge_bases.settings、mcp_catalogs.data、
# documents 正文/诊断、upload_operations.result/error/details 等敏感或大字段。
#
# 首次启动：snapshot.mode=initial 会把现存业务行全部投递一次（op=r），缓存消费者
# 因此为每个 key 递增 revision 并重建，形成切换后的“新版本基线”（见契约 §8 第 3 步）。
# 直接 SQL 修改/删除也会产生 binlog 事件，所以手工改库同样会收敛。
#
# 断点恢复：offset 与 schema history 写在独立的 cache volume（/debezium/data）上；
# 该连接器使用独立的 database.server.id，与任务连接器互不影响。

# --- Sink: native Kafka ---------------------------------------------------
debezium.sink.type=kafka
# Container-internal bootstrap address; host processes use RAG_KAFKA_BOOTSTRAP_SERVERS.
debezium.sink.kafka.producer.bootstrap.servers=${RAG_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
debezium.sink.kafka.producer.key.serializer=org.apache.kafka.common.serialization.StringSerializer
debezium.sink.kafka.producer.value.serializer=org.apache.kafka.common.serialization.StringSerializer
debezium.sink.kafka.producer.acks=all
debezium.sink.kafka.producer.enable.idempotence=true
debezium.sink.kafka.producer.retries=2147483647

# --- Source: MySQL connector ----------------------------------------------
debezium.source.connector.class=io.debezium.connector.mysql.MySqlConnector
debezium.source.database.hostname=${RAG_MYSQL_HOST:mysql}
debezium.source.database.port=${RAG_MYSQL_PORT:3306}
debezium.source.database.user=${RAG_MYSQL_USER:debezium}
debezium.source.database.password=${RAG_MYSQL_PASSWORD}
# Distinct replication identity from the task connector (184054).
debezium.source.database.server.id=${DEBEZIUM_CACHE_SERVER_ID:184055}
debezium.source.database.ssl.mode=preferred

debezium.source.topic.prefix=praxis_rag_cache
debezium.source.database.include.list=${RAG_MYSQL_DATABASE:praxis_rag}
debezium.source.table.include.list=${RAG_MYSQL_DATABASE:praxis_rag}.knowledge_bases,${RAG_MYSQL_DATABASE:praxis_rag}.documents,${RAG_MYSQL_DATABASE:praxis_rag}.mcp_catalogs,${RAG_MYSQL_DATABASE:praxis_rag}.document_heads,${RAG_MYSQL_DATABASE:praxis_rag}.document_leases,${RAG_MYSQL_DATABASE:praxis_rag}.upload_operations,${RAG_MYSQL_DATABASE:praxis_rag}.upload_steps

# Locator columns only (see docs/cdc-migration.md §7.1 for the table -> cache key map):
#   knowledge_bases : namespace, version
#   documents       : namespace, name, document_id, del_flag
#   mcp_catalogs    : namespace
#   document_heads  : namespace, document_id, version
#   document_leases : namespace, resource, owner, operation_id
#   upload_operations: id, namespace, name, status
#   upload_steps    : operation_id, name, status
debezium.source.column.include.list=${RAG_MYSQL_DATABASE:praxis_rag}.knowledge_bases.namespace,${RAG_MYSQL_DATABASE:praxis_rag}.knowledge_bases.version,${RAG_MYSQL_DATABASE:praxis_rag}.documents.namespace,${RAG_MYSQL_DATABASE:praxis_rag}.documents.name,${RAG_MYSQL_DATABASE:praxis_rag}.documents.document_id,${RAG_MYSQL_DATABASE:praxis_rag}.documents.del_flag,${RAG_MYSQL_DATABASE:praxis_rag}.mcp_catalogs.namespace,${RAG_MYSQL_DATABASE:praxis_rag}.document_heads.namespace,${RAG_MYSQL_DATABASE:praxis_rag}.document_heads.document_id,${RAG_MYSQL_DATABASE:praxis_rag}.document_heads.version,${RAG_MYSQL_DATABASE:praxis_rag}.document_leases.namespace,${RAG_MYSQL_DATABASE:praxis_rag}.document_leases.resource,${RAG_MYSQL_DATABASE:praxis_rag}.document_leases.owner,${RAG_MYSQL_DATABASE:praxis_rag}.document_leases.operation_id,${RAG_MYSQL_DATABASE:praxis_rag}.upload_operations.id,${RAG_MYSQL_DATABASE:praxis_rag}.upload_operations.namespace,${RAG_MYSQL_DATABASE:praxis_rag}.upload_operations.name,${RAG_MYSQL_DATABASE:praxis_rag}.upload_operations.status,${RAG_MYSQL_DATABASE:praxis_rag}.upload_steps.operation_id,${RAG_MYSQL_DATABASE:praxis_rag}.upload_steps.name,${RAG_MYSQL_DATABASE:praxis_rag}.upload_steps.status

# Every row change matters to the cache read model, including a change that only
# touches a column outside the locator list; never drop such UPDATEs.
debezium.source.skip.messages.without.change=false

# DELETE events must be captured (cache invalidation), so skipped.operations is
# intentionally unset. Tombstones are useless here: the delete event's before
# image already carries the locator columns.
debezium.source.tombstones.on.delete=false

# DDL/schema-change records must never reach the cache topic.
debezium.source.include.schema.changes=false

# Initial snapshot replays every existing business row once (op=r) so the cache
# revision baseline is rebuilt after cutover. No table locks: the binlog
# low-watermark merge keeps the snapshot consistent without blocking writers.
debezium.source.snapshot.mode=initial
debezium.source.snapshot.locking.mode=none

# --- Durable connector state ----------------------------------------------
# Offsets and schema history live on the dedicated cache volume so a container
# restart resumes from the binlog position instead of re-snapshotting.
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=0
debezium.source.schema.history.internal=io.debezium.storage.file.history.FileSchemaHistory
debezium.source.schema.history.internal.file.filename=/debezium/data/schema-history.dat

# --- Serialisation --------------------------------------------------------
debezium.format.key=json
debezium.format.value=json
# MUST stay false: consumers read before/after/op/source at the top level.
debezium.format.value.schemas.enable=false
debezium.format.key.schemas.enable=false

# --- Topic routing --------------------------------------------------------
# Route every captured table to the single cache topic (default per-table topics
# would scatter 7 tables across 7 topics the cache worker does not subscribe to).
# The consumer maps `source.table` to cache keys, so the single topic is safe.
debezium.source.transforms=RouteCache
debezium.source.transforms.RouteCache.type=io.debezium.transforms.ByLogicalTableRouter
debezium.source.transforms.RouteCache.topic.regex=(.*)
debezium.source.transforms.RouteCache.topic.replacement=${RAG_CACHE_TOPIC:praxis_state_cache_refresh}
debezium.source.transforms.RouteCache.key.enforce.uniqueness=false
